[project]
name = "localmail-sdk"
version = "0.1.0"
description = "Repo-internal Python client for LocalMail"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
