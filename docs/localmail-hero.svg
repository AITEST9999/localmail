<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">LocalMail — local-first email inbox API for AI agents</title>
  <desc id="desc">Dark architecture hero: agents connect through API, SMTP, workers, dashboard, and Mailpit to real inboxes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06090F"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#071018"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06090F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2436" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#101826" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#122033"/>
      <stop offset="100%" stop-color="#0D1624"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="40%" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#67E8F9"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Top rule -->
  <rect x="48" y="36" width="1184" height="1" fill="#22D3EE" opacity="0.25"/>

  <!-- Brand row -->
  <g transform="translate(64,56)">
    <!-- Original mark: envelope + terminal cursor (not a Claude artifact) -->
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#0F1A2A" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.5"/>
    <path d="M8 14h28v18H8z" fill="none" stroke="#E2E8F0" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M8 14l14 10L36 14" fill="none" stroke="#22D3EE" stroke-width="1.6" stroke-linejoin="round"/>
    <rect x="30" y="28" width="2" height="8" fill="#A78BFA"/>
    <text x="58" y="30" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="700" letter-spacing="-0.5">LocalMail</text>
    <text x="210" y="30" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="500">local-first inbox API for agents</text>
  </g>

  <!-- Hero headline -->
  <text x="64" y="148" fill="#F1F5F9" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="650" letter-spacing="-0.6">Every agent gets a real inbox.</text>
  <text x="64" y="182" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">REST · SDKs · CLI · WebSockets · webhooks · MCP — on your machine or Railway.</text>

  <!-- Architecture stage -->
  <g transform="translate(64,220)">
    <rect width="1152" height="340" rx="20" fill="url(#panel)" stroke="#334155" stroke-opacity="0.65" stroke-width="1"/>
    <rect x="1" y="1" width="1150" height="1" fill="#F8FAFC" opacity="0.08"/>

    <!-- Left: Agents -->
    <g transform="translate(36,40)">
      <text x="0" y="0" fill="#64748B" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.2">AGENTS</text>
      <!-- agent cards -->
      <g transform="translate(0,20)">
        <rect width="200" height="56" rx="12" fill="#0B1422" stroke="#A78BFA" stroke-opacity="0.45"/>
        <circle cx="28" cy="28" r="10" fill="#A78BFA" fill-opacity="0.25" stroke="#A78BFA" stroke-width="1.2"/>
        <path d="M24 28h8M28 24v8" stroke="#C4B5FD" stroke-width="1.4"/>
        <text x="48" y="25" fill="#E2E8F0" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="600">coding agent</text>
        <text x="48" y="42" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">OTP · signup · tools</text>
      </g>
      <g transform="translate(0,90)">
        <rect width="200" height="56" rx="12" fill="#0B1422" stroke="#818CF8" stroke-opacity="0.45"/>
        <circle cx="28" cy="28" r="10" fill="#818CF8" fill-opacity="0.25" stroke="#818CF8" stroke-width="1.2"/>
        <circle cx="28" cy="28" r="3" fill="#C7D2FE"/>
        <text x="48" y="25" fill="#E2E8F0" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="600">support agent</text>
        <text x="48" y="42" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">watch · triage · reply</text>
      </g>
      <g transform="translate(0,160)">
        <rect width="200" height="56" rx="12" fill="#0B1422" stroke="#22D3EE" stroke-opacity="0.4"/>
        <circle cx="28" cy="28" r="10" fill="#22D3EE" fill-opacity="0.2" stroke="#22D3EE" stroke-width="1.2"/>
        <rect x="23" y="23" width="10" height="10" rx="2" fill="none" stroke="#A5F3FC" stroke-width="1.3"/>
        <text x="48" y="25" fill="#E2E8F0" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="600">MCP client</text>
        <text x="48" y="42" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">inbox tools over stdio</text>
      </g>
    </g>

    <!-- Flow lines agents → API -->
    <path d="M250 88 H310" stroke="url(#accentLine)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M250 158 H310" stroke="#818CF8" stroke-opacity="0.55" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M250 228 H310" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Center core: LocalMail platform -->
    <g transform="translate(320,28)">
      <rect width="520" height="284" rx="16" fill="url(#core)" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1.4"/>
      <text x="24" y="28" fill="#67E8F9" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.4">LOCALMAIL PLATFORM</text>

      <!-- API -->
      <g transform="translate(24,48)">
        <rect width="220" height="72" rx="12" fill="#0A1524" stroke="#38BDF8" stroke-opacity="0.5"/>
        <text x="16" y="28" fill="#E0F2FE" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700">API + WebSocket</text>
        <text x="16" y="48" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Fastify · /v1 · signed webhooks</text>
      </g>

      <!-- Inboxes -->
      <g transform="translate(268,48)">
        <rect width="228" height="72" rx="12" fill="#0A1524" stroke="#34D399" stroke-opacity="0.55"/>
        <text x="16" y="28" fill="#D1FAE5" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700">Inboxes</text>
        <text x="16" y="48" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">create · send · receive · thread</text>
      </g>

      <!-- SMTP -->
      <g transform="translate(24,140)">
        <rect width="150" height="64" rx="12" fill="#0A1524" stroke="#F59E0B" stroke-opacity="0.45"/>
        <text x="14" y="28" fill="#FEF3C7" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">SMTP</text>
        <text x="14" y="46" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">inbound :2525</text>
      </g>

      <!-- Workers -->
      <g transform="translate(186,140)">
        <rect width="150" height="64" rx="12" fill="#0A1524" stroke="#A78BFA" stroke-opacity="0.45"/>
        <text x="14" y="28" fill="#EDE9FE" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">Workers</text>
        <text x="14" y="46" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">BullMQ · classify</text>
      </g>

      <!-- Dashboard -->
      <g transform="translate(348,140)">
        <rect width="148" height="64" rx="12" fill="#0A1524" stroke="#60A5FA" stroke-opacity="0.45"/>
        <text x="14" y="28" fill="#DBEAFE" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">Dashboard</text>
        <text x="14" y="46" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Next.js admin</text>
      </g>

      <!-- Internal links -->
      <path d="M134 120 H268" stroke="#34D399" stroke-opacity="0.45" stroke-width="1.3"/>
      <path d="M99 140 V140" stroke="#64748B" stroke-opacity="0.3"/>
      <text x="24" y="252" fill="#64748B" font-family="ui-monospace, Menlo, monospace" font-size="11">Postgres · Redis · MinIO · Mailpit  ·  Docker Compose / Railway</text>
    </g>

    <!-- Right: outcomes -->
    <g transform="translate(880,40)">
      <text x="0" y="0" fill="#64748B" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.2">OUTCOMES</text>
      <g transform="translate(0,24)">
        <rect width="236" height="70" rx="12" fill="#07140F" stroke="#34D399" stroke-opacity="0.5"/>
        <text x="16" y="30" fill="#A7F3D0" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">agent@localmail.test</text>
        <text x="16" y="50" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">owned address · loopback OK</text>
      </g>
      <g transform="translate(0,110)">
        <rect width="236" height="70" rx="12" fill="#0B1220" stroke="#22D3EE" stroke-opacity="0.45"/>
        <text x="16" y="30" fill="#A5F3FC" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">waitForEmail()</text>
        <text x="16" y="50" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">OTP / confirm link in tests</text>
      </g>
      <g transform="translate(0,196)">
        <rect width="236" height="70" rx="12" fill="#0B1220" stroke="#FBBF24" stroke-opacity="0.4"/>
        <text x="16" y="30" fill="#FDE68A" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">Mailpit catcher</text>
        <text x="16" y="50" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">see outbound · no public MX</text>
      </g>
    </g>

    <!-- Core → outcomes -->
    <path d="M840 100 H870" stroke="#34D399" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M840 186 H870" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M840 272 H870" stroke="#FBBF24" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Footer strip -->
  <text x="64" y="600" fill="#64748B" font-family="ui-monospace, Menlo, monospace" font-size="12">self-hosted · agent-native · MIT</text>
  <text x="1216" y="600" fill="#475569" font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="end">docs/localmail-hero.svg</text>
</svg>
