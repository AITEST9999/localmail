<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">LocalMail</title>
  <desc id="desc">LocalMail — email API, agent inboxes, and SMTP for developers</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="45%" stop-color="#0c1424"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowL" cx="18%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#312e81" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="82%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0e7490" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="envFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="envFlap" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="chipStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <filter id="iconGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#glowL)"/>
  <rect width="1200" height="420" rx="24" fill="url(#glowR)"/>

  <!-- Subtle grid -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <path d="M0 70 H1200 M0 140 H1200 M0 210 H1200 M0 280 H1200 M0 350 H1200"/>
    <path d="M100 0 V420 M200 0 V420 M300 0 V420 M400 0 V420 M500 0 V420 M600 0 V420 M700 0 V420 M800 0 V420 M900 0 V420 M1000 0 V420 M1100 0 V420"/>
  </g>

  <!-- Soft border -->
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#334155" stroke-opacity="0.55"/>

  <!-- Left visual: inbox stack + envelope -->
  <g transform="translate(88,78)" filter="url(#softShadow)">
    <!-- Back card -->
    <rect x="28" y="18" width="250" height="168" rx="18" fill="#1e293b" opacity="0.55"/>
    <!-- Mid card -->
    <rect x="14" y="34" width="250" height="168" rx="18" fill="#1e293b" opacity="0.75"/>
    <!-- Front inbox card -->
    <rect x="0" y="50" width="250" height="176" rx="18" fill="url(#card)" stroke="#334155" stroke-width="1.25"/>
    <!-- Inbox header bar -->
    <rect x="0" y="50" width="250" height="42" rx="18" fill="#1e293b"/>
    <rect x="0" y="74" width="250" height="18" fill="#1e293b"/>
    <circle cx="24" cy="71" r="5" fill="#ef4444" opacity="0.9"/>
    <circle cx="42" cy="71" r="5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="60" cy="71" r="5" fill="#22c55e" opacity="0.9"/>
    <text x="86" y="76" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="0.04em">INBOX</text>
    <!-- Message rows -->
    <rect x="18" y="108" width="214" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-opacity="0.6"/>
    <rect x="28" y="116" width="72" height="6" rx="3" fill="#6366f1" opacity="0.85"/>
    <rect x="28" y="126" width="120" height="5" rx="2.5" fill="#475569"/>
    <rect x="18" y="146" width="214" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-opacity="0.45"/>
    <rect x="28" y="154" width="58" height="6" rx="3" fill="#22d3ee" opacity="0.75"/>
    <rect x="28" y="164" width="140" height="5" rx="2.5" fill="#475569"/>
    <rect x="18" y="184" width="214" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-opacity="0.35"/>
    <rect x="28" y="192" width="64" height="6" rx="3" fill="#818cf8" opacity="0.7"/>
    <rect x="28" y="202" width="100" height="5" rx="2.5" fill="#475569"/>

    <!-- Floating envelope motif -->
    <g transform="translate(168,8)" filter="url(#iconGlow)">
      <rect x="0" y="22" width="96" height="64" rx="10" fill="url(#envFace)" opacity="0.95"/>
      <path d="M8 28 L48 54 L88 28" fill="none" stroke="#e0e7ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
      <path d="M8 78 L38 52" fill="none" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
      <path d="M88 78 L58 52" fill="none" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
      <!-- Gloss -->
      <path d="M10 30 Q48 52 86 30 L86 34 Q48 56 10 34 Z" fill="#ffffff" opacity="0.12"/>
    </g>
  </g>

  <!-- Right copy -->
  <g transform="translate(420,96)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#818cf8" letter-spacing="0.22em">LOCAL-FIRST EMAIL PLATFORM</text>
    <text x="0" y="58" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="700" fill="url(#titleGrad)" letter-spacing="-0.02em">LocalMail</text>
    <text x="0" y="108" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#94a3b8">Email API · agent inboxes · SMTP for developers</text>

    <!-- Feature chips -->
    <g transform="translate(0,148)" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">
      <!-- API -->
      <rect x="0" y="0" width="72" height="34" rx="17" fill="#0f172a" stroke="url(#chipStroke)" stroke-width="1.25"/>
      <text x="36" y="22" text-anchor="middle" fill="#e2e8f0">API</text>
      <!-- SMTP -->
      <rect x="84" y="0" width="84" height="34" rx="17" fill="#0f172a" stroke="url(#chipStroke)" stroke-width="1.25"/>
      <text x="126" y="22" text-anchor="middle" fill="#e2e8f0">SMTP</text>
      <!-- Webhooks -->
      <rect x="180" y="0" width="112" height="34" rx="17" fill="#0f172a" stroke="url(#chipStroke)" stroke-width="1.25"/>
      <text x="236" y="22" text-anchor="middle" fill="#e2e8f0">Webhooks</text>
      <!-- Dashboard -->
      <rect x="304" y="0" width="118" height="34" rx="17" fill="#0f172a" stroke="url(#chipStroke)" stroke-width="1.25"/>
      <text x="363" y="22" text-anchor="middle" fill="#e2e8f0">Dashboard</text>
      <!-- FTS -->
      <rect x="434" y="0" width="72" height="34" rx="17" fill="#0f172a" stroke="url(#chipStroke)" stroke-width="1.25"/>
      <text x="470" y="22" text-anchor="middle" fill="#e2e8f0">FTS</text>
    </g>
  </g>

  <!-- Bottom accent line -->
  <rect x="420" y="372" width="120" height="3" rx="1.5" fill="#6366f1" opacity="0.85"/>
  <rect x="548" y="372" width="60" height="3" rx="1.5" fill="#22d3ee" opacity="0.55"/>
</svg>
