<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">LocalMail</title>
  <desc id="desc">Dark README hero for LocalMail — local-first inbox API for AI agents. Architecture: agents to API and SMTP to inboxes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080E"/>
      <stop offset="50%" stop-color="#0A1220"/>
      <stop offset="100%" stop-color="#071018"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="18%" r="42%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#05080E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#152033" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0C1422" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.7"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="2" fill="#22D3EE" opacity="0.4"/>

  <!-- Brand -->
  <g transform="translate(48,36)">
    <rect width="40" height="40" rx="10" fill="#0E1A2A" stroke="#22D3EE" stroke-opacity="0.65" stroke-width="1.5"/>
    <path d="M8 13h24v16H8z" fill="none" stroke="#F1F5F9" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M8 13l12 9 12-9" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="28" y="25" width="2" height="7" fill="#A78BFA"/>
    <text x="54" y="28" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="700" letter-spacing="-0.6">LocalMail</text>
    <text x="214" y="28" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">local-first inbox API for agents</text>
  </g>

  <text x="48" y="118" fill="#F1F5F9" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="32" font-weight="650" letter-spacing="-0.5">Every agent gets a real inbox.</text>
  <text x="48" y="148" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15">REST · SDKs · CLI · WebSockets · webhooks · MCP — Docker Compose or Railway.</text>

  <!-- Feature chips -->
  <g transform="translate(48,168)" font-family="ui-monospace, Menlo, monospace" font-size="12">
    <rect width="64" height="28" rx="8" fill="#0B1524" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="32" y="18" text-anchor="middle" fill="#E0F2FE">API</text>
    <rect x="76" width="72" height="28" rx="8" fill="#0B1524" stroke="#F59E0B" stroke-opacity="0.45"/>
    <text x="112" y="18" text-anchor="middle" fill="#FEF3C7">SMTP</text>
    <rect x="160" width="100" height="28" rx="8" fill="#0B1524" stroke="#A78BFA" stroke-opacity="0.45"/>
    <text x="210" y="18" text-anchor="middle" fill="#EDE9FE">Webhooks</text>
    <rect x="272" width="110" height="28" rx="8" fill="#0B1524" stroke="#60A5FA" stroke-opacity="0.45"/>
    <text x="327" y="18" text-anchor="middle" fill="#DBEAFE">Dashboard</text>
    <rect x="394" width="84" height="28" rx="8" fill="#0B1524" stroke="#34D399" stroke-opacity="0.45"/>
    <text x="436" y="18" text-anchor="middle" fill="#D1FAE5">Mailpit</text>
  </g>

  <!-- Architecture strip -->
  <g transform="translate(48,220)">
    <rect width="1104" height="152" rx="16" fill="url(#stage)" stroke="#334155" stroke-opacity="0.7" stroke-width="1"/>
    <rect x="1" y="1" width="1102" height="1" fill="#F8FAFC" opacity="0.08"/>

    <!-- Agents -->
    <g transform="translate(24,28)">
      <text x="0" y="0" fill="#64748B" font-family="ui-monospace, Menlo, monospace" font-size="10" letter-spacing="1.2">AGENTS</text>
      <rect y="12" width="180" height="44" rx="10" fill="#0A1420" stroke="#A78BFA" stroke-opacity="0.5"/>
      <text x="16" y="39" fill="#E2E8F0" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="600">coding · support · MCP</text>
      <rect y="66" width="180" height="36" rx="10" fill="#0A1420" stroke="#818CF8" stroke-opacity="0.35"/>
      <text x="16" y="89" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">own an address, not a scrape</text>
    </g>

    <path d="M220 78 H268" stroke="url(#flow)" stroke-width="2"/>
    <polygon points="268,74 278,78 268,82" fill="#67E8F9"/>

    <!-- Platform -->
    <g transform="translate(288,28)">
      <text x="0" y="0" fill="#67E8F9" font-family="ui-monospace, Menlo, monospace" font-size="10" letter-spacing="1.2">LOCALMAIL</text>
      <rect y="12" width="150" height="88" rx="12" fill="#081420" stroke="#22D3EE" stroke-opacity="0.5"/>
      <text x="16" y="44" fill="#E0F2FE" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700">API + WS</text>
      <text x="16" y="66" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Fastify /v1</text>
      <text x="16" y="84" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">signed hooks</text>

      <rect x="166" y="12" width="130" height="40" rx="10" fill="#081420" stroke="#F59E0B" stroke-opacity="0.45"/>
      <text x="182" y="37" fill="#FEF3C7" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">SMTP :2525</text>
      <rect x="166" y="60" width="130" height="40" rx="10" fill="#081420" stroke="#A78BFA" stroke-opacity="0.4"/>
      <text x="182" y="85" fill="#EDE9FE" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">Workers</text>

      <rect x="312" y="12" width="150" height="88" rx="12" fill="#081420" stroke="#34D399" stroke-opacity="0.55"/>
      <text x="328" y="44" fill="#D1FAE5" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700">Inboxes</text>
      <text x="328" y="66" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">send · receive</text>
      <text x="328" y="84" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">thread · search</text>
    </g>

    <path d="M766 78 H814" stroke="url(#flow)" stroke-width="2"/>
    <polygon points="814,74 824,78 814,82" fill="#34D399"/>

    <!-- Outcomes -->
    <g transform="translate(836,28)">
      <text x="0" y="0" fill="#64748B" font-family="ui-monospace, Menlo, monospace" font-size="10" letter-spacing="1.2">OUTCOMES</text>
      <rect y="12" width="240" height="40" rx="10" fill="#07140F" stroke="#34D399" stroke-opacity="0.5"/>
      <text x="14" y="37" fill="#A7F3D0" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600">agent@localmail.test</text>
      <rect y="60" width="240" height="40" rx="10" fill="#0A1420" stroke="#22D3EE" stroke-opacity="0.45"/>
      <text x="14" y="85" fill="#A5F3FC" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600">waitForEmail() · Mailpit</text>
    </g>
  </g>

  <text x="48" y="400" fill="#475569" font-family="ui-monospace, Menlo, monospace" font-size="11">self-hosted · agent-native · MIT</text>
  <text x="1152" y="400" fill="#334155" font-family="ui-monospace, Menlo, monospace" font-size="11" text-anchor="end">docs/assets/localmail-hero.svg</text>
</svg>
